<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dramaku App</title>
<style>
:root{--primary:#e50914;--bg:#0f0f0f}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;padding-bottom:60px}.view-section{display:none}.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#000;position:sticky;top:0;z-index:100;border-bottom:1px solid #222}.navbar-brand{color:var(--primary);font-size:24px;font-weight:900;letter-spacing:2px;cursor:pointer}.search-container{display:flex;gap:8px;flex:1;justify-content:flex-end}.search-box{padding:8px 15px;border-radius:20px;border:1px solid #444;background:#191919;color:#fff;outline:0;width:100%;max-width:200px}.search-btn,.info-btn{background:var(--primary);color:#fff;border:0;padding:9px 15px;border-radius:6px;font-weight:bold;cursor:pointer}.hero{height:50vh;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:30px 20px}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 5%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.8))}.hero-content{position:relative;z-index:2;width:100%}.hero-title{font-size:2rem;font-weight:900;margin-bottom:5px}.hero-desc{font-size:.95rem;line-height:1.4;margin-bottom:15px;max-width:800px}.row{padding:15px 20px 5px}.row h2,.related-section h2{font-size:1.1rem;margin-bottom:10px;border-left:3px solid var(--primary);padding-left:8px}.row-posters{display:flex;overflow-x:auto;gap:12px;padding-bottom:10px}.row-posters::-webkit-scrollbar{display:none}.poster-card{width:110px;flex-shrink:0;cursor:pointer}.poster-box{width:100%;padding-top:150%;position:relative;border-radius:8px;overflow:hidden;background:#222}.poster-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.3s}.poster-box img.loaded{opacity:1}.page-container{padding:20px;min-height:100vh}.page-header{font-size:1.5rem;border-left:4px solid var(--primary);padding-left:10px;margin-bottom:20px}.sort-select{background:#222;color:#fff;border:1px solid #444;padding:10px;border-radius:5px;width:100%;margin-bottom:10px}.grid-container{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid-item{cursor:pointer}.grid-item p{text-align:center;margin-top:8px;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ccc}.pagination{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:20px 0}.page-num,.page-btn{padding:8px 12px;background:#222;border:1px solid #444;border-radius:5px;color:#fff;cursor:pointer}.page-num.active{background:var(--primary);border-color:var(--primary)}#detailView{min-height:100vh;position:relative;background-size:cover;background-position:center}#detailView:before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(8px)}.back-nav,.detail-content,.related-section{position:relative;z-index:2}.back-nav{padding:15px 20px;color:#aaa;font-weight:bold;cursor:pointer}.detail-content{padding:0 20px 20px}.detail-title{font-size:2rem;font-weight:900;margin-bottom:10px}.detail-meta{color:#aaa;margin-bottom:15px;display:flex;gap:10px;align-items:center}.rating-badge{background:var(--primary);padding:3px 8px;border-radius:4px;font-weight:bold}.detail-overview{line-height:1.5;margin-bottom:25px}.action-posters{display:flex;gap:15px;margin-bottom:20px}.action-card{width:130px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;position:relative;border:2px solid #555;box-shadow:0 5px 15px #000;cursor:pointer}.action-card img{width:100%;height:100%;object-fit:cover;opacity:0}.action-card img.loaded{opacity:1}.action-card:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent 60%)}.action-card .label{position:absolute;bottom:12px;left:0;width:100%;text-align:center;font-size:.85rem;font-weight:bold;z-index:2}.card-movie{border-color:var(--primary)}.related-section{padding-bottom:80px}.related-section h2{margin-left:20px}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0a0a0a;border-top:1px solid #222;display:flex;z-index:1000}.nav-item{flex:1;text-align:center;padding:18px 0;font-size:.8rem;font-weight:800;color:#666;cursor:pointer;border-top:3px solid transparent}.nav-item.active{color:#fff;border-top-color:var(--primary)}#globalLoader{position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;flex-direction:column}.loader-logo{font-size:2.5rem;font-weight:900;color:var(--primary);letter-spacing:5px;animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:1;transform:scale(1.08)}}#loaderMessage{margin-top:15px;color:#888;text-align:center;max-width:90%}#playerModal{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column}.player-header{padding:15px;display:flex;justify-content:space-between;background:#111;border-bottom:1px solid var(--primary)}.server-selector{background:#222;color:#fff;padding:8px;border-radius:5px;border:1px solid #444}.close-btn{font-size:25px;cursor:pointer}#videoIframe{width:100%;flex:1;border:0}@media(max-width:400px){.grid-container{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="navbar" id="topNavbar"><div class="navbar-brand" onclick="navigateTo('home')">DRAMAKU</div><div class="search-container"><input id="searchInput" class="search-box" placeholder="Cari film..."><button class="search-btn" onclick="executeSearch()">Cari</button></div></div>
<div id="globalLoader" class="view-section"><div class="loader-logo">DRAMAKU</div><div id="loaderMessage">Memuat...</div></div>
<div id="homeView" class="view-section"><div id="hero" class="hero"><div class="hero-content"><h1 id="heroTitle" class="hero-title">Memuat...</h1><p id="heroDesc" class="hero-desc">Menyinkronkan...</p><button id="heroPlayBtn" class="info-btn">Lihat Detail</button></div></div><div class="row"><h2>Sedang Trending</h2><div class="row-posters" id="row-trending"></div></div><div class="row"><h2>Action Super Tegang</h2><div class="row-posters" id="row-action"></div></div><div class="row"><h2>Horor Bikin Merinding</h2><div class="row-posters" id="row-horror"></div></div><div class="row"><h2>Komedi Bikin Ngakak</h2><div class="row-posters" id="row-comedy"></div></div></div>
<div id="exploreView" class="view-section page-container"><h2 id="exploreTitle" class="page-header">Jelajah Film</h2><select id="sortSelect" class="sort-select" onchange="applySort()"><option value="popularity.desc">Paling Banyak Ditonton</option><option value="vote_average.desc">Rating Tertinggi</option><option value="primary_release_date.desc">Terbaru Dirilis</option></select><div class="pagination" id="paginationTop"></div><div class="grid-container" id="exploreGrid"></div><div class="pagination" id="paginationBottom"></div></div>
<div id="historyView" class="view-section page-container"><h2 class="page-header">Riwayat Tontonan</h2><div class="grid-container" id="historyGrid"></div></div>
<div id="detailView" class="view-section"><div class="back-nav" onclick="goBack()">❮ KEMBALI</div><div class="detail-content"><h1 class="detail-title" id="detTitle">Memuat...</h1><div class="detail-meta"><span class="rating-badge" id="detRating">0.0</span><span id="detYear">N/A</span></div><div class="action-posters"><div class="action-card card-movie" onclick="startPlayback('movie')"><img id="cardMovieImg"><div class="label">▶ FULL MOVIE</div></div><div class="action-card card-trailer" id="trailerCard" onclick="startPlayback('trailer')"><img id="cardTrailerImg"><div class="label">🎬 TRAILER</div></div></div><p class="detail-overview" id="detDesc">Menarik sinopsis...</p></div><div class="related-section"><h2>Rekomendasi Serupa</h2><div class="row-posters" id="row-related"></div></div></div>
<div id="playerModal"><div class="player-header"><select class="server-selector" id="serverSelect" onchange="changeServer()"><option value="vidsrc">Server Utama (VidSrc)</option><option value="embedsu">Server Alternatif 1 (EmbedSU)</option><option value="vidsrcpro">Server Alternatif 2 (VidSrc Pro)</option></select><span class="close-btn" onclick="closePlayer()">✖</span></div><iframe id="videoIframe" allowfullscreen></iframe></div>
<div class="bottom-nav" id="bottomNav"><div class="nav-item active" id="nav-home" onclick="navigateTo('home')">BERANDA</div><div class="nav-item" id="nav-explore" onclick="navigateTo('explore',{mode:'popular'})">JELAJAH</div><div class="nav-item" id="nav-history" onclick="navigateTo('history')">RIWAYAT</div></div>
<script>
const IMG_URL='https://image.tmdb.org/t/p/w500',TMDB_PROXY='/api/tmdb',REQUEST_TIMEOUT=15000;
let currentExploreMode='popular',currentSort='popularity.desc',searchQuery='',currentPage=1,totalPages=1,activeMovieId=null,activeTrailerKey=null,currentPlayType='movie';
function section(id){document.querySelectorAll('.view-section').forEach(e=>e.style.display='none');const el=document.getElementById(id);if(el)el.style.display=id==='globalLoader'?'flex':'block';const detail=id==='detailView'||id==='globalLoader';document.getElementById('topNavbar').style.display=detail?'none':'flex';document.getElementById('bottomNav').style.display=detail?'none':'flex';if(id!=='globalLoader')scrollTo(0,0)}
function updateNav(page){document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));if(['home','explore','history'].includes(page))document.getElementById('nav-'+page).classList.add('active')}
function navigateTo(page,params={},push=true){if(push){const state={page,params};const hash=page==='home'?'':`#${page}`;history.pushState(state,'',location.pathname+location.search+hash)}updateNav(page);if(page==='home')section('homeView');else if(page==='explore')openExplore(params.mode||'popular',params.page||1,params.query||'');else if(page==='history')loadHistory();else if(page==='detail'&&params.id)loadMovieDetail(params.id);else if(page==='player'){} }
function setLoader(msg){document.getElementById('loaderMessage').textContent=msg||'Memuat...';section('globalLoader')}
async function tmdbFetch(path,query=''){const c=new AbortController(),t=setTimeout(()=>c.abort(),REQUEST_TIMEOUT);try{const r=await fetch(`${TMDB_PROXY}/${path}${query?`?${query}`:''}`,{signal:c.signal});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json()}finally{clearTimeout(t)}}
function errorMessage(e){return e.name==='AbortError'?'Koneksi TMDB terlalu lama. Coba lagi.':'Gagal memuat data. Coba refresh.'}
function createPosterHTML(m){const src=m.poster_path?IMG_URL+m.poster_path:'https://via.placeholder.com/300x450?text=No+Poster';return `<div class="poster-box"><img src="${src}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster';this.classList.add('loaded')"></div><p>${escapeHTML(m.title||'Tanpa Judul')}</p>`}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function initHome(){try{const d=await tmdbFetch('trending/movie/week','language=id-ID');const m=d.results?.[0];if(!m)throw Error('No hero');document.getElementById('heroTitle').textContent=m.title;document.getElementById('heroDesc').textContent=m.overview||'';document.getElementById('heroPlayBtn').onclick=()=>navigateTo('detail',{id:m.id});if(m.backdrop_path)document.getElementById('hero').style.backgroundImage=`url(https://image.tmdb.org/t/p/original${m.backdrop_path})`;fetchRow('trending/movie/day','language=id-ID','row-trending');fetchRow('discover/movie','with_genres=28&language=id-ID&sort_by=popularity.desc','row-action');fetchRow('discover/movie','with_genres=27&language=id-ID&sort_by=popularity.desc','row-horror');fetchRow('discover/movie','with_genres=35&language=id-ID&sort_by=popularity.desc','row-comedy')}catch(e){document.getElementById('heroDesc').textContent=errorMessage(e)}}
async function fetchRow(endpoint,query,rowId){try{const d=await tmdbFetch(endpoint,query),row=document.getElementById(rowId);row.innerHTML='';(d.results||[]).filter(m=>m.poster_path).forEach(m=>{const x=document.createElement('div');x.className='poster-card';x.onclick=()=>navigateTo('detail',{id:m.id});x.innerHTML=createPosterHTML(m);row.appendChild(x)})}catch(e){console.warn('fetchRow',e)}}
function executeSearch(){const q=document.getElementById('searchInput').value.trim();if(q)navigateTo('explore',{mode:'search',query:q,page:1})}
function applySort(){currentSort=document.getElementById('sortSelect').value;navigateTo('explore',{mode:'popular',page:1})}
async function openExplore(mode,pageNum,query){setLoader('Memuat katalog...');currentExploreMode=mode;currentPage=pageNum;if(query)searchQuery=query;try{let d;if(mode==='popular'){document.getElementById('exploreTitle').textContent='Jelajah Film';document.getElementById('sortSelect').style.display='block';const extra=currentSort==='vote_average.desc'?'&vote_count.gte=200':'';d=await tmdbFetch('discover/movie',`language=id-ID&sort_by=${currentSort}${extra}&page=${currentPage}`)}else{document.getElementById('exploreTitle').textContent=`Hasil: "${escapeHTML(searchQuery)}"`;document.getElementById('sortSelect').style.display='none';d=await tmdbFetch('search/movie',`language=id-ID&query=${encodeURIComponent(searchQuery)}&page=${currentPage}`)}totalPages=Math.min(d.total_pages||1,500);renderPagination();const grid=document.getElementById('exploreGrid');grid.innerHTML='';(d.results||[]).filter(m=>m.poster_path).forEach(m=>{const x=document.createElement('div');x.className='grid-item';x.onclick=()=>navigateTo('detail',{id:m.id});x.innerHTML=createPosterHTML(m);grid.appendChild(x)});section('exploreView')}catch(e){section('exploreView');document.getElementById('exploreGrid').innerHTML=`<p style="grid-column:1/-1;text-align:center;color:#888">${errorMessage(e)}</p>`}}
function renderPagination(){let h='';if(currentPage>1)h+=`<button class="page-btn" onclick="goToPage(${currentPage-1})">❮</button>`;for(let i=Math.max(1,currentPage-2);i<=Math.min(totalPages,currentPage+2);i++)h+=`<div class="page-num ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</div>`;if(currentPage<totalPages)h+=`<button class="page-btn" onclick="goToPage(${currentPage+1})">❯</button>`;document.getElementById('paginationTop').innerHTML=h;document.getElementById('paginationBottom').innerHTML=h}
function goToPage(p){if(p>=1&&p<=totalPages&&p!==currentPage)navigateTo('explore',{mode:currentExploreMode,query:searchQuery,page:p})}
function saveToHistory(m){let h=JSON.parse(localStorage.getItem('dramaku_history')||'[]').filter(x=>x.id!==m.id);h.unshift({id:m.id,title:m.title,poster_path:m.poster_path});localStorage.setItem('dramaku_history',JSON.stringify(h.slice(0,30)))}
function loadHistory(){section('historyView');const h=JSON.parse(localStorage.getItem('dramaku_history')||'[]'),g=document.getElementById('historyGrid');g.innerHTML=h.length?'':'<p style="grid-column:1/-1;text-align:center;color:#888">Belum ada riwayat tontonan.</p>';h.forEach(m=>{const x=document.createElement('div');x.className='grid-item';x.onclick=()=>navigateTo('detail',{id:m.id});x.innerHTML=createPosterHTML(m);g.appendChild(x)})}
async function loadMovieDetail(id){setLoader('Memuat detail film...');try{const m=await tmdbFetch(`movie/${id}`,'language=id-ID');if(!m.overview){const en=await tmdbFetch(`movie/${id}`,'language=en-US');m.overview=en.overview||'Sinopsis tidak tersedia.'}activeMovieId=m.id;saveToHistory(m);document.getElementById('detTitle').textContent=m.title;document.getElementById('detRating').textContent=`⭐ ${(m.vote_average||0).toFixed(1)}`;document.getElementById('detYear').textContent=m.release_date?.slice(0,4)||'';document.getElementById('detDesc').textContent=m.overview||'';document.getElementById('cardMovieImg').src=m.poster_path?IMG_URL+m.poster_path:'';document.getElementById('cardMovieImg').onload=()=>document.getElementById('cardMovieImg').classList.add('loaded');if(m.backdrop_path)document.getElementById('detailView').style.backgroundImage=`url(https://image.tmdb.org/t/p/original${m.backdrop_path})`;const v=await tmdbFetch(`movie/${id}/videos`);const trailer=v.results?.find(x=>x.type==='Trailer'&&x.site==='YouTube')||v.results?.find(x=>x.site==='YouTube');activeTrailerKey=trailer?.key||null;const tc=document.getElementById('trailerCard');if(activeTrailerKey){document.getElementById('cardTrailerImg').src=`https://img.youtube.com/vi/${activeTrailerKey}/hqdefault.jpg`;document.getElementById('cardTrailerImg').onload=()=>document.getElementById('cardTrailerImg').classList.add('loaded');tc.style.display='block'}else tc.style.display='none';await fetchRow(`movie/${id}/similar`,'language=id-ID','row-related');section('detailView')}catch(e){section('homeView');alert(errorMessage(e))}}
function goBack(){if(history.state?.page&&history.state.page!=='home')history.back();else if(history.length>1)history.back();else navigateTo('home',{},false)}
function startPlayback(type){if(type==='trailer'&&!activeTrailerKey)return;currentPlayType=type;history.pushState({page:'player',params:{id:activeMovieId,type}},'',location.pathname+location.search+'#player');showPlayer()}
function showPlayer(){const modal=document.getElementById('playerModal'),iframe=document.getElementById('videoIframe'),sel=document.getElementById('serverSelect');modal.style.display='flex';if(currentPlayType==='trailer'){sel.style.display='none';iframe.src=`https://www.youtube.com/embed/${activeTrailerKey}?autoplay=1`}else{sel.style.display='block';sel.value='vidsrc';changeServer()}if(modal.requestFullscreen)modal.requestFullscreen().catch(()=>{})}
function changeServer(){if(currentPlayType!=='movie'||!activeMovieId)return;const s=document.getElementById('serverSelect').value;document.getElementById('videoIframe').src=s==='vidsrc'?`https://vidsrc.me/embed/movie?tmdb=${activeMovieId}`:s==='embedsu'?`https://embed.su/embed/movie/${activeMovieId}`:`https://vidsrc.pro/embed/movie/${activeMovieId}`}
function closePlayer(){if(history.state?.page==='player')history.back();else hidePlayer()}
function hidePlayer(){document.getElementById('playerModal').style.display='none';document.getElementById('videoIframe').src='';if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
window.addEventListener('popstate',e=>{const s=e.state;if(s?.page==='player'){if(activeMovieId)showPlayer();return}hidePlayer();if(s?.page==='detail'&&s.params?.id){loadMovieDetail(s.params.id)}else if(s?.page==='explore')openExplore(s.params?.mode||'popular',s.params?.page||1,s.params?.query||'');else if(s?.page==='history')loadHistory();else{history.replaceState({page:'home',params:{}},'',location.pathname+location.search);section('homeView');updateNav('home')}});
function restoreRoute(){const hash=location.hash.replace('#','');if(hash==='detail'&&history.state?.page==='detail'&&history.state.params?.id){loadMovieDetail(history.state.params.id);return}if(hash==='player'&&history.state?.page==='player'&&activeMovieId){showPlayer();return}history.replaceState({page:'home',params:{}},'',location.pathname+location.search);section('homeView');updateNav('home')}
document.getElementById('searchInput').addEventListener('keypress',e=>{if(e.key==='Enter')executeSearch()});initHome();restoreRoute();
</script>
</body></html>
