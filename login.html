<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dramaku</title>
    <style>
        :root { --primary:#e50914; --bg:#0f0f0f; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(circle at top,#261010,var(--bg) 55%); color:#fff; font-family:Arial,Helvetica,sans-serif; }
        .card { width:100%; max-width:390px; padding:30px; background:#171717; border:1px solid #292929; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
        .logo { color:var(--primary); text-align:center; font-size:32px; font-weight:900; letter-spacing:4px; margin-bottom:8px; }
        .subtitle { text-align:center; color:#888; margin-bottom:25px; }
        label { display:block; margin:14px 0 7px; color:#ccc; font-size:14px; }
        input { width:100%; padding:13px 14px; border:1px solid #3a3a3a; border-radius:8px; background:#0d0d0d; color:#fff; outline:none; }
        input:focus { border-color:var(--primary); }
        button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:8px; background:var(--primary); color:#fff; font-weight:700; cursor:pointer; }
        button:disabled { opacity:.6; cursor:not-allowed; }
        .message { min-height:20px; margin-top:15px; text-align:center; font-size:14px; color:#ff8585; }
        .hint { margin-top:16px; text-align:center; color:#666; font-size:12px; line-height:1.5; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">DRAMAKU</div>
        <div class="subtitle">Masuk dengan akun langgananmu</div>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" placeholder="Username" required>

            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>

            <button id="loginBtn" type="submit">Masuk</button>
        </form>

        <div id="message" class="message"></div>
        <div class="hint">Gunakan username dan password yang diberikan saat berlangganan.</div>
    </main>

    <script>
        const DATABASE_URL = "https://dramakuvip-default-rtdb.asia-southeast1.firebasedatabase.app";
        const form = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            loginBtn.disabled = true;
            loginBtn.textContent = "Memeriksa...";

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            try {
                // username adalah field di /users/{id}/username.
                // ID pelanggan tidak perlu diketahui oleh pengguna saat login.
                const url = `${DATABASE_URL}/users.json?orderBy=%22username%22&equalTo=${encodeURIComponent(JSON.stringify(username))}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Firebase HTTP ${response.status}`);
                }

                const users = await response.json();
                const entries = users ? Object.entries(users) : [];

                // Struktur akun lama:
                // users/{customerId}/deviceId = password
                // users/{customerId}/username = username
                const matched = entries.find(([customerId, user]) => {
                    return user && user.username === username && user.deviceId === password;
                });

                if (!matched) {
                    message.textContent = "Username atau password salah.";
                    return;
                }

                const [customerId, user] = matched;

                // Simpan sesi minimum di browser. Password tidak disimpan.
                sessionStorage.setItem("dramaku_user", JSON.stringify({
                    id: customerId,
                    username: user.username
                }));

                window.location.replace("index.html");
            } catch (error) {
                console.error("Login error:", error);
                message.textContent = "Tidak dapat terhubung ke server. Coba lagi.";
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Masuk";
            }
        });
    </script>
</body>
</html>
